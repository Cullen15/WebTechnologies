<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bob Marshall Text Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="top">
    <h1>Bob Marshall Text Adventure</h1>
    <p class="subtitle">Outside Seeley Lake, Montana. Type a choice and hit Enter.</p>
  </header>

  <main class="layout">
    <section class="card">
      <img id="sceneImg" src="imgs/trailhead.jpg" alt="Scene image" />

      <div class="content">
        <h2 id="sceneHeading">Trailhead</h2>

        <p id="storyText">
          You’re hiking into the Bob Marshall outside Seeley Lake. It’s early and quiet.
          Type one of the options below.
        </p>

        <p class="options"><strong>Options:</strong> <span id="optionsText"></span></p>

        <div class="inputRow">
          <input id="userInput" type="text" placeholder="Type your choice..." autocomplete="off" />
          <button id="goBtn">Go</button>
        </div>

        <p id="hintText" class="hint"></p>

        <p class="status">
          Decisions made: <strong id="decisionCount">0</strong>
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

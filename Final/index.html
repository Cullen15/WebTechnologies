<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Treasure Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Treasure Runner</h1>
  <p>Use WASD or arrow keys. Collect all gold before hitting the red hazards.</p>

  <div id="gameInfo">
    <span id="scoreText">Score: 0</span>
    <span id="levelText">Level: 1</span>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <p id="message">Press Start to play.</p>
  <button id="startButton">Start Game</button>
  <button id="restartButton">Restart</button>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViewMaster Social Justice Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewer">
    <h1>ViewMaster Social Justice Viewer</h1>
    <p class="intro">
      This is a small collection of images and artworks that connect to social justice
      issues from around the world. Click the button to view a new slide.
    </p>

    <div class="slide-box">
      <img id="slideImage" src="imgs/migrant-mother.jpg" alt="Social justice slide">
      <h2 id="slideTitle">Slide Title</h2>
      <p id="slideDescription">Slide description goes here.</p>
      <p class="meta">
        <span id="slideAuthor">Author</span> •
        <span id="slideYear">Year</span>
      </p>
    </div>

    <button id="nextButton">View Next Slide</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
